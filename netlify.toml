# The site was a static directory published from the repo root. It is a
# Vite build now, so the build command and publish directory have to be
# stated here -- a repo-level netlify.toml overrides the dashboard
# settings, which means this file is the one place the two can be kept
# in step.
[build]
  command = "npm run build"
  publish = "dist"

# The auth pages and the client dashboard moved into React, and their old
# files are deleted. These keep every link already in circulation working --
# an emailed password-reset link, a bookmarked dashboard, a signup link in
# somebody's WhatsApp history. 301 rather than 200 so browsers and search
# engines learn the new address instead of serving the old one forever.
#
# Order matters: Netlify applies redirects top to bottom, so these have to
# sit above the catch-all below or it would swallow them.
[[redirects]]
  from = "/login.html"
  to = "/login"
  status = 301
  force = true

[[redirects]]
  from = "/signup.html"
  to = "/signup"
  status = 301
  force = true

# Both halves of the reset flow are one React route: arriving without a
# recovery session gets the "email me a link" form, arriving from the
# emailed link gets the "choose a password" one.
[[redirects]]
  from = "/forgot-password.html"
  to = "/reset"
  status = 301
  force = true

[[redirects]]
  from = "/reset-password.html"
  to = "/reset"
  status = 301
  force = true

# The old "check your email" page was a whole page for one sentence. Signup
# now says it in place, so its only job is not to 404.
[[redirects]]
  from = "/check-email.html"
  to = "/signup"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard"
  status = 301
  force = true

# Terms and Privacy moved into React. These two files were the live legal
# documents until now -- the signup consent checkbox pointed at them -- so
# the old URLs are certainly in circulation and must not 404.
[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

# Retired marketing pages (old services and offers). The files are deleted;
# their addresses stay in search results and bookmarks, so they redirect.
[[redirects]]
  from = "/real-estate.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/referral.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/business-pool.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/how-it-works.html"
  to = "/#how-it-works"
  status = 301
  force = true

[[redirects]]
  from = "/legacy-landing.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Real React routes are served the app shell with 200. Pages with their own
# prerendered file (services, packages, maya, ...) are matched by that file first.
[[redirects]]
  from = "/maya"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/forge"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/packages"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/create-project"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/orders"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/messages"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/invoices"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/files"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

# Anything else is not a real page: serve the app shell (which renders the
# "We can't find that page" screen) with a real 404 status, so unknown URLs
# are not indexed as duplicates of the homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# The operator console stays available to signed-in staff but is never indexed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
