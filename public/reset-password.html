<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — AgenticCore Biz</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="chat-widget.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="logo.png" alt="AgenticCore">
    </a>
    <h1>Set a new password</h1>
    <p class="auth-sub" id="resetPasswordSub">Checking your reset link…</p>

    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>

    <form id="resetPasswordForm" hidden>
      <div class="field-group">
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
          <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.42 18.42 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <div class="field-group">
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.42 18.42 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="resetPasswordBtn">Update password</button>
    </form>

    <p class="auth-footer" id="resetPasswordFooter" hidden>Need a new link? <a href="forgot-password.html">Request another one</a></p>
    <p style="text-align:center;margin-top:var(--space-md);display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;">
      <button type="button" class="btn btn-secondary btn-sm auth-home-btn" onclick="history.back()">← Back</button>
      <a href="index.html" class="btn btn-primary btn-sm auth-home-btn">Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="chat-widget.js"></script>
<script src="visit-tracker.js"></script>
</body>
</html>
