# AgenticCore Biz — Supabase project config.
#
# payram-webhook and telegram-webhook are both called directly by an
# external service (PayRam, Telegram) with no Supabase user session, so
# neither can be gated behind the platform's default JWT verification --
# each authenticates the request itself (an HMAC signature for PayRam, a
# shared secret header for Telegram). Without this, every call from
# either service is rejected with a 401 at the platform gate before the
# function's own code ever runs, regardless of whether the webhook is
# otherwise configured correctly.

[functions.payram-webhook]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

# owner-alert is called by Postgres triggers through pg_net, which sends
# no Supabase JWT -- it authenticates on a shared secret header read from
# Vault instead. Without this line the platform gate rejects every alert
# with a 401 before the function runs, and the owner silently stops being
# told about orders.
#
# This was missing while owner-alert was deployed by hand with verify_jwt
# set in the dashboard, so nothing in the repo recorded it. The deploy
# workflow added alongside this would have reset it to the default on its
# first run.
[functions.owner-alert]
verify_jwt = false
