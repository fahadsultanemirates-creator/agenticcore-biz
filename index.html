<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Affordable business planning, administration, bookkeeping assistance, CRM setup and managed business services. Organize and grow your business with AgenticCore.biz."
    />
    <meta name="theme-color" content="#09090d" />
    <link rel="canonical" href="https://agenticcore.biz/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="agenticcore.biz" />
    <meta property="og:url" content="https://agenticcore.biz/" />
    <meta property="og:title" content="Start your business. Organize it. Keep it running." />
    <meta
      property="og:description"
      content="Business setup, back-office support and managed services — 19 clearly scoped services with published prices, and three support packages."
    />
    <!-- A real 1200x630 card, built by scripts/make-og-card.py. This pointed
         at favicon.png, a 256px square, so every share previewed as a
         cropped icon. -->
    <meta property="og:image" content="https://agenticcore.biz/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="agenticcore.biz" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Start your business. Organize it. Keep it running."
    />
    <meta
      name="twitter:description"
      content="Business setup, back-office support and managed services — 19 clearly scoped services with published prices, and three support packages."
    />
    <meta name="twitter:image" content="https://agenticcore.biz/og-card.jpg" />
    <title>AgenticCore.biz | Business Setup, Back-Office &amp; AI-Powered Business Support</title>

    <!-- Self-hosted, so these are same-origin and worth preloading: they
         are needed for the first paint and nothing else requests them. -->
    <link
      rel="preload"
      href="/fonts/inter-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
