<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — AgenticCore Biz</title>
<meta name="description" content="Log in to your AgenticCore Biz dashboard to see your plans, requests, and billing.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="logo.png" alt="AgenticCore">
    </a>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to see your plans and requests.</p>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p class="auth-forgot-link"><a href="forgot-password.html">Forgot password?</a></p>
      <button type="submit" class="btn btn-primary" id="loginBtn">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
    <p style="text-align:center;margin-top:var(--space-md);">
      <a href="index.html" class="btn btn-primary btn-sm auth-home-btn">Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
</body>
</html>
